<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Poliglota Digital Library
</title>

<link rel="stylesheet" href="css/dashboard.css">

</head>


<body>


<div class="app">


<!-- SIDEBAR -->

<aside class="sidebar">


<div class="brand">

<img src="assets/logo.png">


<div>

<h1>
POLIGLOTA
</h1>

<p>
Digital Library
</p>


</div>


</div>




<nav>


<button class="nav-btn active" data-filter="all">

📚 All Books

</button>


<button class="nav-btn" data-filter="Kids">

👧 Kids

</button>


<button class="nav-btn" data-filter="Adults">

🎓 Adults

</button>


<button class="nav-btn" data-filter="Business">

💼 Business

</button>


<button class="nav-btn" data-filter="favorites">

⭐ Favorites

</button>


<button class="nav-btn" data-filter="recent">

🕒 Recently Opened

</button>


</nav>


</aside>






<!-- CONTENT -->

<main class="content">



<header class="top">


<h2>
Digital Teaching Library
</h2>


<input
id="searchInput"
type="text"
placeholder="Search books..."
>


</header>





<section id="recentSection">


<h2>
Continue Teaching
</h2>


<div
id="recentBooks"
class="book-grid">

</div>


</section>






<section>


<h2 id="sectionTitle">

All Books

</h2>


<div
id="booksContainer"
class="book-grid">

</div>


</section>



</main>


</div>







<!-- PASSWORD MODAL -->


<div
id="passwordModal"
class="modal">


<div class="modal-card">



<button id="closeModal">

×

</button>




<img
id="modalCover"
src=""
alt="Book cover">



<h2 id="modalTitle"></h2>


<p id="modalInfo"></p>




<input
id="passwordInput"
type="password"
placeholder="Enter password">





<button id="openBook">

Open Book

</button>




<p id="passwordError"></p>




</div>


</div>





<!-- IMPORTANT ORDER -->

<script src="js/books.js"></script>

<script src="js/dashboard.js"></script>



</body>

</html>
