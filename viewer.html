<!-- ==========================
     SLIDE CONTAINER
========================== -->


<div class="slide-container">


<div class="slide-wrapper">


<img 
id="slide-image"
src=""
alt="Slide Image">


<canvas id="edit-canvas"></canvas>


</div>



<button id="prev-btn">

&#9664;

</button>


<button id="next-btn">

&#9654;

</button>



</div>





<!-- ==========================
     WHITEBOARD
========================== -->


<div id="whiteboard">


<canvas id="whiteboard-canvas"></canvas>


</div>






<!-- ==========================
     AUDIO
========================== -->


<div id="audio-list-container"></div>




<audio 
id="slide-audio"
controls
style="display:none;">


<source
id="audio-source"
src=""
type="audio/mpeg">


Your browser does not support audio.


</audio>





<button
id="hide-audio-btn"
style="display:none;">


Hide Player


</button>







<!-- ==========================
     VIDEO
========================== -->


<video
id="slide-video"
controls
style="
display:none;
max-width:80%;
max-height:70%;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:2000;
">


<source
id="video-source"
src=""
type="video/mp4">


Your browser does not support video.


</video>





<button
id="hide-video-btn"
style="
display:none;
position:fixed;
top:10%;
left:120px;
z-index:2001;
">


Hide Video


</button>







<!-- ==========================
     EDIT TRAY
========================== -->


<div id="edit-tray">



<button 
class="edit-tool-btn"
id="pencil-tool">


✏️


</button>



<div id="pencil-size-menu">


<div 
class="size-option"
data-size="2">
</div>


<div 
class="size-option"
data-size="5">
</div>


<div 
class="size-option"
data-size="10">
</div>


</div>





<button 
class="edit-tool-btn"
id="pen-tool">


🖊️


</button>




<button 
class="edit-tool-btn"
id="eraser-tool">


🧽


</button>




<button 
class="edit-tool-btn"
id="highlight-tool">


🖍️


</button>





<button 
class="edit-tool-btn"
id="text-tool">


🔤


</button>




<button 
class="edit-tool-btn"
id="clear-tool">


🗑️


</button>
